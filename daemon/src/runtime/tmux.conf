# Aubergine runs every terminal session inside tmux on its own socket, with
# this config instead of the user's. The goal is for tmux to be invisible:
# it only keeps the shells alive and remembers their screen and history.

set -g status off
set -g prefix None
set -g prefix2 None
set -s escape-time 0
set -g history-limit 50000
set -g window-size latest
set -g mouse on

# Start the user's own shell as a login shell (tmux does this when no
# default command is set).
set -g default-command ""

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -g focus-events on

# Text copied inside tmux (for example by selecting with the mouse) is passed
# on to the viewer as an OSC 52 sequence, which puts it on the system clipboard.
set -g set-clipboard on
set -as terminal-features ",xterm-256color:clipboard"
