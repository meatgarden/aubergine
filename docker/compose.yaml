# Aubergine and a web server for HTTPS, in two containers that share one network.
#
# Run once on 2026-11-22, on an Apple-silicon Mac with Docker in Colima (linux/arm64), under
# https://aubergine.localhost with the web server's own certificate. Not tried: a real name with a
# public certificate, a cloud machine, linux/amd64. See "In a container" in docs/remote.md.
# The steps, and what to send back when something fails, are there too.
#
#   cd docker
#   cp .env.example .env        # then set AUBERGINE_HOST in it
#   docker compose up -d --build
#
# That builds the image from this checkout. To use the published image instead (linux/amd64 and
# linux/arm64, from a release tag; AUBERGINE_TAG in .env picks the version, latest by default):
#
#   docker compose pull
#   docker compose up -d
#
# How Compose treats `image` and `build` together, as it does with no pull_policy set: `up` uses the
# image of that name already on the machine; when there is none, it pulls it, and builds from the
# checkout when the pull fails. `up --build` builds from the checkout either way and gives the result
# that name (when no image of that name is on the machine yet, it first tries to pull one; `docker
# compose build` and then `up -d` does not). `pull` puts the published image under that name, in
# place of one built here. So the name holds whichever came last.
#
# Why the network is shared: Aubergine listens on 127.0.0.1 only, and that does not change. A port
# published for it would reach nothing. So `proxy` joins the network namespace of the `aubergine`
# container, where 127.0.0.1 is the same for both, and only the web server's ports 80 and 443 are
# published. They are written on the `aubergine` service because the network is that container's;
# what listens on them is the web server. Never publish Aubergine's own port (4600).
#
# Why the network is Aubergine's and not the web server's: a container that joined another's
# network loses it when that other one is restarted, and has to be restarted too. The terminals
# live in the `aubergine` container, so the web server can be restarted (after a change to the
# Caddyfile, say) without ending them. When the `aubergine` container is restarted by Docker itself
# after a failure, restart the web server too: docker compose restart proxy (this was seen: until
# then the page cannot be reached). Compose's own restart and `up` restart it by themselves.

name: aubergine

services:
  proxy:
    image: caddy:2
    restart: unless-stopped
    # Aubergine's network: the web server's 127.0.0.1 is Aubergine's 127.0.0.1.
    network_mode: "service:aubergine"
    depends_on:
      aubergine:
        condition: service_started
        # Restarted with it when Compose restarts or makes `aubergine` again: its network is gone otherwise.
        restart: true
    environment:
      AUBERGINE_HOST: ${AUBERGINE_HOST:?Set AUBERGINE_HOST in docker/.env to the name other devices will open, such as aubergine.example.net}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # The web server's certificates and its own state.
      - caddy-data:/data
      - caddy-config:/config

  aubergine:
    # The published image, and the name a build from this checkout is given (see above).
    image: ghcr.io/thirstyeggplant/aubergine:${AUBERGINE_TAG:-latest}
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # The web server's ports, on the network the two share. Aubergine's own port is not among them.
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    # tmux and the shells are children of the server that must be reaped.
    init: true
    restart: unless-stopped
    # The server stops within a few seconds of being asked; this leaves it room.
    stop_grace_period: 20s
    security_opt:
      - "no-new-privileges:true"
    environment:
      # Written into config.json by the entrypoint on the first start only, when there is none.
      AUBERGINE_ADDRESS: https://${AUBERGINE_HOST:?Set AUBERGINE_HOST in docker/.env}
    volumes:
      # The home folder: your clones, the agents you install, and Aubergine's data folder
      # (~/.local/share/aubergine: the state, the access token, the paired devices).
      - aubergine-home:/home/aubergine

volumes:
  aubergine-home:
  caddy-data:
  caddy-config:
