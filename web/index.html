<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#17181c" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Aubergine</title>
    <script>
      // Before anything is drawn: the theme that was chosen (the server writes it on this page; a copy is kept in this
      // browser for when it does not), or for "match the system" the one the system has; the color theme of that kind,
      // and the colors laid over it (a theme file's own, and those set by hand), each held to its shape; on the address of a
      // project with a theme of its own, the copy of what was drawn for it. So no other theme is seen first.
      (function () {
        var root = document.documentElement;
        var stored = function (key) {
          try {
            return localStorage.getItem(key);
          } catch (e) {
            return null;
          }
        };
        var setting = root.getAttribute('data-theme-setting') || stored('aubergine.theme');
        if (setting !== 'dark' && setting !== 'light') setting = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        var id = root.getAttribute('data-theme-' + setting) || stored('aubergine.theme.' + setting);
        if (!id || !/^[a-z-]{1,40}$/.test(id)) id = setting;
        var colors = root.getAttribute('data-colors-' + setting);
        if (colors === null && !root.hasAttribute('data-theme-' + setting)) colors = stored('aubergine.colors.' + setting);
        var own = root.getAttribute('data-theme-' + setting + '-id');
        if (own === null && !root.hasAttribute('data-theme-' + setting)) own = stored('aubergine.theme.' + setting + '.id');
        // An address of a project (/p/<project>/…, after /s/<link>/ for a linked server) whose theme of this kind is its
        // own: what this browser last drew for it, which the server cannot know. Anything else is corrected once loaded.
        var path = (window.location && window.location.pathname) || '';
        var project = /^(?:\/s\/[a-z0-9]{8})?\/p\/([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(?:\/|$)/.exec(path);
        var theirs = project ? 'aubergine.project.' + project[1] + '.theme.' + setting : null;
        var their = theirs ? stored(theirs) : null;
        if (their && /^[a-z-]{1,40}$/.test(their)) {
          id = their;
          colors = stored(theirs + '.colors');
          own = stored(theirs + '.id');
        }
        var pairs = colors ? String(colors).split(',') : [];
        for (var i = 0; i < pairs.length; i++) {
          var pair = /^([a-z-]+):(#[0-9a-f]{6})$/.exec(pairs[i]);
          if (pair) root.style.setProperty('--' + pair[1], pair[2]);
        }
        // The theme's own ID: a theme file is drawn as the built-in theme it is laid over, and named here.
        if (!own || !/^[a-z][a-z0-9-]{0,39}$/.test(own)) own = id;
        root.setAttribute('data-color-theme', id);
        root.setAttribute('data-color-theme-id', own);
        root.setAttribute('data-theme', setting);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
