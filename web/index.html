<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#17181c" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>Aubergine</title>
    <script>
      // Before anything is drawn: the theme that was chosen (the server writes it on this page; a copy is kept in this
      // browser for when it does not), or for "match the system" the one the system has; the color theme of that kind,
      // and the colors set by hand over it, each held to its shape. So no other theme is seen first.
      (function () {
        var root = document.documentElement;
        var stored = function (key) {
          try {
            return localStorage.getItem(key);
          } catch (e) {
            return null;
          }
        };
        var setting = root.getAttribute('data-theme-setting') || stored('aubergine.theme');
        if (setting !== 'dark' && setting !== 'light') setting = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        var id = root.getAttribute('data-theme-' + setting) || stored('aubergine.theme.' + setting);
        if (!id || !/^[a-z-]{1,40}$/.test(id)) id = setting;
        var colors = root.getAttribute('data-colors-' + setting);
        if (colors === null && !root.hasAttribute('data-theme-' + setting)) colors = stored('aubergine.colors.' + setting);
        var pairs = colors ? String(colors).split(',') : [];
        for (var i = 0; i < pairs.length; i++) {
          var pair = /^([a-z-]+):(#[0-9a-f]{6})$/.exec(pairs[i]);
          if (pair) root.style.setProperty('--' + pair[1], pair[2]);
        }
        root.setAttribute('data-color-theme', id);
        root.setAttribute('data-theme', setting);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
