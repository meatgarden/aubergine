name: Check

# Runs `pnpm check` (type checking, lint, shellcheck, generated files, unit tests, the installer tests and the browser
# smoke test) on every push to main and every pull request. The badge in the README shows the result for main.
#
# On macOS, the platform Aubergine supports and where the whole check is known to pass. Linux is not yet: there the
# installer's end-to-end test needs node-gyp for node-pty, and the installer tests' PATH of single tools does not hold
# everything the installer runs. A Linux job belongs here once those pass. The tests start their own tmux servers on
# test sockets.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # zsh comes with macOS.
      - name: tmux and shellcheck
        run: |
          brew install tmux shellcheck
          tmux -V

      # The shell integration tests start a login zsh; an empty ~/.zshrc keeps it from asking its first-run question.
      - name: A login shell with a startup file
        run: |
          touch ~/.zshrc
          echo "SHELL=$(command -v zsh)" >> "$GITHUB_ENV"

      # Some tests make Git commits in temporary repositories.
      - name: A Git identity for the tests
        run: |
          git config --global user.name "Aubergine CI"
          git config --global user.email "ci@example.invalid"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: A browser for the smoke test
        run: pnpm exec playwright install chromium

      - run: pnpm check

      - name: Keep the browser test's report when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results*/
            playwright-report*/
          if-no-files-found: ignore
          retention-days: 7
