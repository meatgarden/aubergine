name: An idea
description: Something Aubergine could do, or do better.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The work you are doing and where Aubergine gets in the way or falls short. This matters more than the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: markdown
    attributes:
      value: The [roadmap](https://thirstyeggplant.com/roadmap/) lists what is planned and not built yet.
